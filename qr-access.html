<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeTempo 手機訪問 QR Code</title>
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #333;
            margin: 0 0 10px 0;
            font-size: 24px;
        }
        p {
            color: #666;
            margin: 0 0 20px 0;
            font-size: 14px;
        }
        .url {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 16px;
            word-break: break-all;
            margin: 20px 0;
            color: #6c5ce7;
            font-weight: bold;
        }
        .qr-placeholder {
            width: 200px;
            height: 200px;
            background: #f0f0f0;
            border: 2px dashed #ccc;
            border-radius: 10px;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
        }
        .qr-image {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            border-radius: 10px;
            display: none;
        }
        .note {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 13px;
            color: #856404;
        }
        .btn {
            background: #6c5ce7;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #5a4bcf;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 LifeTempo 手機訪問</h1>
        <p>用您的手機掃描 QR Code 或輸入網址</p>

        <div class="url">http://192.168.1.105:4173</div>

        <div class="qr-placeholder" id="qrPlaceholder">
            QR Code<br>
            (載入中...)
        </div>
        <img class="qr-image" id="qrImage" alt="LifeTempo QR Code">

        <div class="note">
            <strong>注意：</strong><br>
            • 確保手機和電腦在同一 WiFi<br>
            • 確保電腦防火牆已允許端口 4173<br>
            • 或使用 ngrok 創建公網地址
        </div>

        <button class="btn" onclick="copyUrl()">複製網址</button>
    </div>

    <script>
        const url = 'http://192.168.1.105:4173';

        // Generate QR Code using free API
        function generateQRCode() {
            const qrPlaceholder = document.getElementById('qrPlaceholder');
            const qrImage = document.getElementById('qrImage');

            // Use goqr.me API (free, no rate limit)
            const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;

            qrImage.src = qrApiUrl;
            qrImage.onload = () => {
                qrPlaceholder.style.display = 'none';
                qrImage.style.display = 'block';
            };
            qrImage.onerror = () => {
                qrPlaceholder.innerHTML = 'QR Code<br>載入失敗<br>請手動輸入網址';
            };
        }

        function copyUrl() {
            navigator.clipboard.writeText(url)
                .then(() => alert('網址已複製！請在手機瀏覽器貼上'))
                .catch(() => {
                    // Fallback for older browsers
                    const textArea = document.createElement('textarea');
                    textArea.value = url;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    alert('網址已複製！請在手機瀏覽器貼上');
                });
        }

        // Generate QR Code on page load
        window.onload = generateQRCode;
    </script>
</body>
</html>
